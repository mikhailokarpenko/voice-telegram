[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "voice-telegram"
version = "0.1.0"
description = "Telegram voice agent with OpenAI Realtime API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.15.2",
  "asyncpg==0.30.0",
  "fastapi==0.115.12",
  "pydantic-settings==2.9.1",
  "pyjwt==2.9.0",
  "kurigram==2.2.24",
  "py-tgcalls==2.3.3",
  "TgCrypto==1.2.5",
  "sqlalchemy[asyncio]==2.0.40",
  "uvicorn[standard]==0.34.2",
  "websockets==14.2",
  "numpy==2.2.4",
  "soxr==0.5.0.post1",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_telegram"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/voice_telegram/api/*.py" = ["B008"]
"src/voice_telegram/admin/routes.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
