name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    name: Security guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Static guard: no Python/deps needed.
      - name: Admin config guard (no generated admin secrets; prod fails fast)
        run: node scripts/check-admin-config.mjs

  tests:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          PYTHONPATH: src
        run: pytest -q
