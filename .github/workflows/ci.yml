name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    name: Security guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Static guard: no Python/deps needed.
      - name: Admin config guard (no generated admin secrets; prod fails fast)
        run: node scripts/check-admin-config.mjs
      - name: Guard - admin login brute-force throttle (incl. X-Forwarded-For bucket rotation)
        run: node scripts/check-login-throttle.mjs
      - name: Admin session guard (JWT verification, cookie flags, per-route authorisation)
        run: node scripts/check-admin-session.mjs
      - name: Admin XSS guard (service must stay API-only, or re-arm escaping assertions)
        run: node scripts/check-admin-xss.mjs
      - name: Call duration budget guard (max_call_seconds must actually hang calls up)
        run: node scripts/check-call-duration-budget.mjs
      - name: Greeting config guard (greeting_style/custom_greeting must reach the caller)
        run: node scripts/check-greeting-config.mjs
      - name: Security response headers guard (CSP/frame-ancestors defence-in-depth)
        run: node scripts/check-security-headers.mjs
      - name: Config enum guard (dashboard-offered voice/greeting values must be allowlisted on write)
        run: node scripts/check-config-enums.mjs
      - name: CI wiring guard (every guard above must actually be executed)
        run: node scripts/check-ci-wiring.mjs
      # A guard that has never been shown red proves nothing. Each harness
      # mutates one real control out of the tree and requires the guard to
      # fail. It restores every file; git diff --exit-code proves it did.
      # The glob picks up every future harness automatically.
      - name: Mutation-audit the security guards
        run: |
          set -e
          for f in scripts/test-*-guard-mutants.mjs; do
            echo "== $f"
            node "$f"
          done
          git diff --exit-code

  tests:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          PYTHONPATH: src
        run: pytest -q
      # Behavioural mutation audit (BAS-260). The static guard above only greps
      # for the duration budget; this one weakens the watchdog for real and
      # requires the executed pytest suite to go red. It needs Python, so it
      # lives here rather than in the Node-only `guards` job, and is
      # deliberately named outside the `test-*-guard-mutants.mjs` glob.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mutation-audit the call-duration-budget behavioural tests
        env:
          PYTHONPATH: src
          VOICE_TELEGRAM_PYTHON: python
        run: |
          set -e
          node scripts/test-call-duration-budget-behavioural-mutants.mjs
          git diff --exit-code
