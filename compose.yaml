services:
  voice-telegram:
    container_name: voice-telegram
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Pyrogram session lives on the host so logins survive rebuilds and are
      # not baked into the image.
      - ./sessions:/app/sessions
    networks:
      - bashpwnz_default
    command: ["sh", "-c", "alembic upgrade head && python -m voice_telegram.main"]
    expose:
      - "8000"
    mem_limit: 512m

networks:
  bashpwnz_default:
    external: true
